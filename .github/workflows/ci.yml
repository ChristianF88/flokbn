name: CI

on:
  push:
    branches: [ main, master, refactoring/* ]
  pull_request:
    branches: [ main, master ]
  workflow_call:  # Allow reuse from release.yml

# Cancel redundant runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.23.x'
  # Keep builds reproducible and smaller
  GOFLAGS: '-trimpath'
  STATICCHECK_VERSION: 'v0.6.1'

jobs:
  prepare:
    name: Prepare (checkout + Go + deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true  # built-in module & build cache
          cache-dependency-path: flokbn/src/go.sum

      - name: Verify modules are tidy (no diff)
        working-directory: ./flokbn/src
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Prime module cache
        working-directory: ./flokbn/src
        run: go mod download

  lint:
    name: Lint (fmt, vet, staticcheck)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: flokbn/src/go.sum

      - name: gofmt check
        working-directory: ./flokbn/src
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Go files not formatted:"
            echo "$UNFORMATTED"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        working-directory: ./flokbn/src
        run: go vet ./...

      # Pinned. v0.6.1 (2025.1.1) is the last release whose go.mod still
      # allows Go 1.23; newer ones need Go >= 1.25. Bump together with
      # GO_VERSION above.
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}

      - name: staticcheck
        working-directory: ./flokbn/src
        run: staticcheck ./...

  test:
    name: Test (race + coverage)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: flokbn/src/go.sum

      - name: Run tests
        working-directory: ./flokbn/src
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: ./flokbn/src/coverage.out
          retention-days: 21

      - name: Upload to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./flokbn/src/coverage.out
          flags: unittests
          fail_ci_if_error: false

  build:
    name: Build (matrix)
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux   # amd64
            goarch: amd64
            ext: ""
          - goos: darwin  # amd64
            goarch: amd64
            ext: ""
          - goos: darwin  # arm64
            goarch: arm64
            ext: ""
          - goos: windows # amd64
            goarch: amd64
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: flokbn/src/go.sum

      - name: Build binary
        working-directory: ./flokbn/src
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          OUT="flokbn-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -ldflags="-s -w" -o "$OUT" .
          ls -lh "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flokbn-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./flokbn/src/flokbn-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 21

