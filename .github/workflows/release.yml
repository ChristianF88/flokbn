name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v2.1.3, etc.

# Least privilege by default; only the goreleaser job below may write.
permissions:
  contents: read

jobs:
  # Tests, vet and staticcheck run here with a read-only token. The release
  # job must not repeat them: it holds a write token.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  goreleaser:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write  # create the GitHub release and upload its assets
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # Full history for changelog
          persist-credentials: false  # GoReleaser uses GITHUB_TOKEN from env, not git

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          # Pinned: bump deliberately, together with the action SHA above.
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
