# Ships the proxy's access log to flokbn over the Lumberjack protocol.
#
# flokbn reads only the raw `message` field of each event and parses the log
# line itself, so there is nothing to dissect or convert here - any field
# Filebeat adds is ignored on the other side.
filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /var/log/nginx/access.log
  tail_files: true
  # Default scan_frequency (10s) delays the first harvest by up to 10s after
  # startup; 1s keeps end-to-end detection latency low for the e2e suites.
  scan_frequency: 1s

  processors:
    # Trim metadata flokbn never looks at; keeps the batches small.
    - drop_fields:
        fields: ["@metadata", "log", "agent", "ecs", "host", "input"]

# disable modules entirely
filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# flokbn speaks the Lumberjack v2 protocol, i.e. Filebeat's Logstash output.
output.logstash:
  hosts: ["${INGESTOR_HOST}"]
  codec.json:
    pretty: false

# Set to debug (optionally with logging.selectors: ["harvester", "publisher"])
# to verify harvests while troubleshooting.
logging.level: info
